<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play It - stream movies and series.">
  <meta name="theme-color" content="#10D98D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Play It">
  <!-- iOS resolves the Add to Home Screen icon from this link and ignores
       manifest.json, so it needs a real 180x180 rather than the 192 PWA one. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Play It - Movie Streaming</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Registered by hand rather than by Flutter, because the worker Flutter
    // generates only unregisters itself and leaves no fetch handler, which
    // disqualifies the site from Chrome's install criteria.
    window.addEventListener('load', function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('playit-sw.js', { scope: './' }).catch(function (error) {
          console.warn('Play It service worker registration failed:', error);
        });
      }
    });
  </script>
</body>
</html>
